id: go-hardcoded-credentials
version: 1
description: Review literal credential assignments on changed lines
implementation: source-pattern
language: [go]
requires_capabilities: [files]
defaults:
  required: true
  severity: error
  parameters:
    languages: [go]
    prohibited_patterns:
      go: ['(?i)\b(?:password|passwd|secret|api_key|access_key|token)\s*(?::=|=|:)\s*["\x27][^"\x27]{4,}["\x27]']
standard_refs:
  - {source_id: gosec-rules, controls: [go-security-patterns]}
lifecycle_inputs: [go-hardcoded-credentials-review]
