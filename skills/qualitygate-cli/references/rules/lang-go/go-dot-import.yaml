id: go-dot-import
version: 1
description: Review dot imports on changed lines
implementation: source-pattern
language: [go]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [go]
    prohibited_patterns:
      go: ['^\s*(?:import\s+)?\.\s+"']
standard_refs:
  - {source_id: go-code-review, controls: [import-style]}
lifecycle_inputs: [go-dot-import-review]
