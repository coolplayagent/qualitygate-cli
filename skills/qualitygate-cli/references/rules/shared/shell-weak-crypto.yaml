id: shell-weak-crypto
version: 1
description: Review legacy algorithm tokens in shell scripts
implementation: source-pattern
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [shell]
    prohibited_patterns:
      shell: ['(?i)\b(?:des|rc4|md5|sha1)\b']
standard_refs:
  - {source_id: owasp-cryptographic-storage, controls: [algorithm-selection]}
lifecycle_inputs: [shell-weak-crypto-review]
