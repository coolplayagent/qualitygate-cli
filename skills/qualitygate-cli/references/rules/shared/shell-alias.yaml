id: shell-alias
version: 1
description: Review alias definitions in shell scripts
implementation: source-pattern
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [shell]
    prohibited_patterns:
      shell:
        - '^\s*alias\s+'
standard_refs:
  - {source_id: internal-shell-coding, controls: [expressions]}
lifecycle_inputs: [shell-alias-review]
