id: no-emoji
version: 1
description: Flag configured emoji Unicode ranges in added UTF-8 files
implementation: file-pattern
language: []
requires_capabilities: [files]
defaults:
  required: true
  severity: error
  parameters:
    languages: []
    pattern: '[\x{1F300}-\x{1F9FF}]|[\x{2600}-\x{27BF}]|[\x{1F000}-\x{1F02F}]|[\x{1F0A0}-\x{1F0FF}]|[\x{1F100}-\x{1F1FF}]|[\x{1F200}-\x{1F2FF}]|[\x{1FA00}-\x{1FA6F}]|[\x{1FA70}-\x{1FAFF}]'
standard_refs:
  - {source_id: google-code-review, controls: [evidence-over-preference]}
lifecycle_inputs: [emoji-text-convention]
