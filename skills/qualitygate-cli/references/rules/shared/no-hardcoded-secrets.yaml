id: no-hardcoded-secrets
version: 1
description: Reject common literal credential assignments in added Java files
implementation: file-pattern
language: [java]
requires_capabilities: [files]
defaults:
  required: true
  severity: error
  parameters:
    languages: [java]
    pattern: '(?i)(?:password|passwd|secret|apiKey|api_key|accessKey|access_key)\s*=\s*["'']([^"'']{4,})["'']'
standard_refs:
  - {source_id: huawei-codearts, controls: [security-quality, static-gate]}
  - {source_id: meta-zoncolan, controls: [source-sink-analysis, rule-validation]}
lifecycle_inputs: [java-literal-secret-review]
