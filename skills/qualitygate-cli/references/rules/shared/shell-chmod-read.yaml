id: shell-chmod-read
version: 1
description: Review recursive read-permission removal in chmod calls
implementation: source-pattern
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [shell]
    prohibited_patterns:
      shell:
        - '\bchmod\s+(?:-[A-Za-z]+\s+)*[^\n]*\ba-r\b'
standard_refs:
  - {source_id: internal-shell-coding, controls: [security]}
lifecycle_inputs: [shell-chmod-read-review]
