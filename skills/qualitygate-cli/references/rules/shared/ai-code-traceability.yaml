id: ai-code-traceability
version: 1
description: Validate explicitly configured source declarations for added tests
implementation: ai-code-traceability
language: []
requires_capabilities: ["test_methods"]
defaults:
  required: true
  severity: error
  parameters: {}
standard_refs:
  - {source_id: aws-code-review, controls: [change-review, completion-criteria]}
  - {source_id: cloudflare-codex, controls: [governed-standards, design-review]}
lifecycle_inputs: [ai-change-provenance]
