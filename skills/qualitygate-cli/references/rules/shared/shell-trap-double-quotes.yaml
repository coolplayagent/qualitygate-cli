id: shell-trap-double-quotes
version: 1
description: Review double-quoted trap handlers
implementation: source-pattern
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [shell]
    prohibited_patterns:
      shell: ['(?i)\btrap\b\s+"']
standard_refs:
  - {source_id: shellcheck-wiki, controls: [trap-quoting]}
lifecycle_inputs: [shell-trap-double-quotes-review]
