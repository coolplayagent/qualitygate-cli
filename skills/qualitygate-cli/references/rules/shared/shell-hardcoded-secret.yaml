id: shell-hardcoded-secret
version: 1
description: Flag quoted credential assignments
implementation: source-pattern
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: error
  parameters:
    languages: [shell]
    prohibited_patterns:
      shell: ['(?i)\b(?:password|passwd|secret|api_key|access_key|token)\s*=\s*["\x27][^"\x27$\s][^"\x27]*["\x27]']
standard_refs:
  - {source_id: owasp-secrets, controls: [hardcoded-credentials]}
lifecycle_inputs: [shell-hardcoded-secret-review]
