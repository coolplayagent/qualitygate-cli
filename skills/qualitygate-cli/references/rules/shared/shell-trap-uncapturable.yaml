id: shell-trap-uncapturable
version: 2
description: Flag traps for SIGKILL or SIGSTOP
implementation: language-syntax
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: error
  parameters:
    languages: [shell]
standard_refs:
  - {source_id: gnu-bash, controls: [traps]}
lifecycle_inputs: [shell-trap-uncapturable-review]
