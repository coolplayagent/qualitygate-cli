id: shell-password-echo
version: 1
description: Review password reads without silent mode
implementation: source-pattern
language: [shell]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [shell]
    prohibited_patterns:
      shell: ['(?i)\bread\s+(?:-r\s+)?(?:[A-Za-z_][A-Za-z0-9_]*_)?password\b']
standard_refs:
  - {source_id: gnu-bash, controls: [read-builtin]}
lifecycle_inputs: [shell-password-echo-review]
