id: cpp-no-macro-constant
version: 1
description: Review numeric macro constants in C++ code
implementation: source-pattern
language: [cpp]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [cpp]
    prohibited_patterns:
      cpp:
        - '^\s*#\s*define\s+[A-Za-z_]\w*\s+(?:0[xX][0-9A-Fa-f]+|\d+(?:\.\d*)?)[uUlLfF]*\s*$'
standard_refs:
  - {source_id: internal-cpp-coding, controls: [preprocessing]}
lifecycle_inputs: [cpp-no-macro-constant-review]
