id: ts-no-arguments
version: 1
description: Review arguments object usage in TypeScript or JavaScript code
implementation: source-pattern
language: [typescript]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [typescript]
    prohibited_patterns:
      typescript:
        - '\barguments\b'
standard_refs:
  - {source_id: internal-typescript-coding, controls: [functions]}
lifecycle_inputs: [ts-no-arguments-review]
