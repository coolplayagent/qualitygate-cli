id: c-no-goto
version: 1
description: Review goto statements in C and C++ code
implementation: source-pattern
language: [c, cpp]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [c, cpp]
    prohibited_patterns:
      c:
        - '\bgoto\b'
      cpp:
        - '\bgoto\b'
standard_refs:
  - {source_id: internal-c-coding, controls: [control-flow]}
  - {source_id: internal-cpp-coding, controls: [expressions]}
lifecycle_inputs: [c-no-goto-review]
