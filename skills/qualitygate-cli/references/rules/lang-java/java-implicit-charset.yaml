id: java-implicit-charset
version: 1
description: Review zero-argument getBytes calls
implementation: source-pattern
language: [java]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [java]
    prohibited_patterns:
      java:
        - '\bgetBytes\s*\(\s*\)'
standard_refs:
  - {source_id: huawei-codearts, controls: [coding-style]}
lifecycle_inputs: [java-implicit-charset-review]
