id: junit-naming
version: 1
description: Validate Java JUnit test names
implementation: test-naming
language: ["java"]
requires_capabilities: ["test_methods","annotations"]
defaults:
  required: true
  severity: error
  parameters: {"languages":["java"]}
standard_refs:
  - {source_id: alibaba-ajcg, controls: [naming, test-maintainability]}
  - {source_id: google-java, controls: [naming, source-file]}
  - {source_id: huawei-codearts, controls: [coding-style, static-gate]}
lifecycle_inputs: [java-test-conventions]
