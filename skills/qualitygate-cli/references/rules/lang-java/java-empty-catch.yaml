id: java-empty-catch
version: 1
description: Review empty same-line catch blocks
implementation: source-pattern
language: [java]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [java]
    prohibited_patterns:
      java:
        - '\bcatch\s*\([^)]*\)\s*\{\s*\}'
standard_refs:
  - {source_id: huawei-codearts, controls: [coding-style]}
lifecycle_inputs: [java-empty-catch-review]
