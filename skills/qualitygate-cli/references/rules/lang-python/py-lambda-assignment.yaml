id: py-lambda-assignment
version: 1
description: Review lambdas assigned to a name in Python code
implementation: source-pattern
language: [python]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [python]
    prohibited_patterns:
      python:
        - '^\s*[A-Za-z_]\w*\s*=\s*lambda\b'
standard_refs:
  - {source_id: internal-python-coding, controls: [functions]}
lifecycle_inputs: [py-lambda-assignment-review]
