id: py-assert-in-production
version: 1
description: Review assert statements used for production checks
implementation: source-pattern
language: [python]
requires_capabilities: [files]
defaults:
  required: true
  severity: warning
  parameters:
    languages: [python]
    prohibited_patterns:
      python: ['^\s*assert\s+']
standard_refs:
  - {source_id: ruff-rules, controls: [python-lint-patterns]}
lifecycle_inputs: [py-assert-in-production-review]
