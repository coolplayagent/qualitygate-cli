id: py-hardcoded-credentials
version: 1
description: Review credential-like names assigned string literals
implementation: source-pattern
language: [python]
requires_capabilities: [files]
defaults:
  required: true
  severity: error
  parameters:
    languages: [python]
    prohibited_patterns:
      python: ['(?i)\b(?:password|passwd|secret|api_key|access_key|token)\s*[:=]\s*["''][^"'']{4,}["'']']
standard_refs:
  - {source_id: ruff-rules, controls: [python-lint-patterns]}
lifecycle_inputs: [py-hardcoded-credentials-review]
