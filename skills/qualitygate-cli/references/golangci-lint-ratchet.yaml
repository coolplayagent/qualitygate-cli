# Reference for a provisioned golangci-lint v2 binary and tracked .golangci.yml.
schema_version: 1
checks:
  - id: golangci-lint-ratchet
    argv:
      - golangci-lint
      - run
      - --output.json.path=stdout
      - --output.text.path=stderr
      - --show-stats=false
      - --max-issues-per-linter=0
      - --max-same-issues=0
      - --uniq-by-line=false
      - --modules-download-mode=readonly
      - --timeout=240s
      - ./...
    timeout_seconds: 300
    findings_exit_codes: [1]
    tools:
      - id: golangci-lint
        argv: [golangci-lint, version]
    reports:
      - path: target/golangci-lint.json
        baseline: target/golangci-lint.json
        from_stdout: true
        format: golangci_json
        mode: ratchet
