schema_version: 1
task_id: rust-feature-v1
acceptance:
  - id: feature-behavior
    description: The independently reviewed feature scenarios and existing behavior pass.
    required: true
    severity: error
    verification:
      kind: command
      check_id: rust-feature
      argv: [cargo, test, --locked, --offline, --all-features, --test, feature_contract]
      timeout_seconds: 300
      tools:
        - id: cargo
          argv: [cargo, --version]
          inputs: [Cargo.toml, Cargo.lock]
        - id: rustc
          argv: [rustc, --version]
