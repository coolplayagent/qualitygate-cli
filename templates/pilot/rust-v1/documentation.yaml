schema_version: 1
task_id: rust-documentation-v1
acceptance:
  - id: documentation-behavior
    description: The reviewed documentation and rule examples match the repository behavior.
    required: true
    severity: error
    verification:
      kind: command
      check_id: rust-documentation
      argv: [cargo, test, --locked, --offline, --all-features, --test, documentation_contract]
      timeout_seconds: 300
      tools:
        - id: cargo
          argv: [cargo, --version]
          inputs: [Cargo.toml, Cargo.lock]
        - id: rustc
          argv: [rustc, --version]
