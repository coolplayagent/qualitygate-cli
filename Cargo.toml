[package]
name = "qualitygate-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Snapshot-bound repository policy and task acceptance gates for coding agents"
license = "MIT"
repository = "https://github.com/coolplayagent/qualitygate-cli"
readme = "README.md"
keywords = ["quality", "ci", "agents", "policy", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "qualitygate"
path = "src/qualitygate/lib.rs"

[[bin]]
name = "qualitygate"
path = "src/qualitygate/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
globset = "0.4"
process-wrap = { version = "9.1", features = ["tokio1"] }
regex = "1"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
sha2 = "0.10.9"
similar = "2.7"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tree-sitter = "0.26.8"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-bash = "0.25.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
which = "8"
dunce = "1"

[target.'cfg(windows)'.dependencies]
file-id = "0.2.3"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "debuginfo"
