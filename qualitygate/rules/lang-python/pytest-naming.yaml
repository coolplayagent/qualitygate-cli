id: pytest-naming
version: 1
description: Validate Python test names while preserving pytest discovery
implementation: test-naming
language: ["python"]
requires_capabilities: ["test_methods"]
defaults:
  required: true
  severity: error
  parameters: {"languages":["python"]}
standard_refs:
  - {source_id: google-python, controls: [naming, lint]}
  - {source_id: huawei-codearts, controls: [coding-style, static-gate]}
lifecycle_inputs: [python-test-conventions]
