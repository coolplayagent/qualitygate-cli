id: used-undeclared
version: 1
description: Require direct declarations for dependencies used by compiled Maven sources
implementation: used-undeclared
language: [java]
requires_capabilities: [dependency_usage]
defaults:
  enabled: true
  required: true
  severity: error
standard_refs:
  - {source_id: alibaba-p3c, controls: [dependency-rules, static-analysis]}
  - {source_id: aws-component-management, controls: [component-inventory, dependency-management]}
  - {source_id: huawei-codearts, controls: [security-quality, static-gate]}
lifecycle_inputs: [java-direct-dependencies]
