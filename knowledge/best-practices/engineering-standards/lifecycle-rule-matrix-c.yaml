    outcome: warning
    source_ids: [internal-c-coding, internal-cpp-coding]
    evidence: [changed-c-family-line, syntax-node]
    applicability: Selected changed C and C++ lines when this optional rule is enabled.
    critical_adoption: Single-exit cleanup labels can be justified; forward-only and cross-function control flow require control-flow analysis.
  - id: c-no-process-launch-review
    status: enforced
    rule_id: c-no-process-launch
    lifecycle_stage: implementation
    languages: [c, cpp]
    concerns: [security]
    enforcement: deterministic-static
    outcome: warning
    source_ids: [internal-c-coding, internal-cpp-coding]
    evidence: [changed-c-family-line, syntax-node]
    applicability: Selected changed C and C++ lines when this optional rule is enabled.
    critical_adoption: Process-launch calls are high-risk review signals; argument provenance, white-listing and platform APIs require semantic analysis.
