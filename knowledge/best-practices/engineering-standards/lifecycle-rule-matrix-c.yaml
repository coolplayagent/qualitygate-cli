schema_version: 1
inputs:
  - id: c-array-safety-review
    status: enforced
    rule_id: c-array-safety
    lifecycle_stage: implementation
    languages: [c, cpp]
    concerns: [security, reliability]
    enforcement: deterministic-static
    outcome: violation
    source_ids: [sei-cert-c, sei-cert-cpp]
    evidence: [changed-c-family-line, regex-pattern]
    applicability: Selected changed C and C++ lines when this optional rule is enabled.
    critical_adoption: Variable-bound array declarations need type and bounds review; this regex does not prove stack overflow.
  - id: c-assertion-discipline-review
