schema_version: 5
reviewed_on: 2026-09-13
purpose: Reviewed primary engineering guidance mapped to qualitygate lifecycle inputs.
source_policy:
  authority_order: [repository-policy, task-contract, standards-body, industry-standard, industry-consortium, language-ecosystem, official-company, company-project, project-guide, advisory]
  adoption_rule: External guidance is evidence, not an implicit repository policy.
  freshness_rule: Recheck continuously maintained pages before changing enforcement.
coverage:
  organizations: [Alibaba, Google, Huawei Cloud, NVIDIA, AWS, Microsoft Azure, Cloudflare, Meta]
  languages: [java, python, rust, cpp, cuda, typescript, go]
  lifecycle_stages: [plan, architecture, implementation, review, static-analysis, verification, release, operations]
  concerns: [coding, architecture, security, performance, static-gate, quality-gate]
sources:
