name: Bazel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bazel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          external-cache: true
          repository-cache: true
          cache-save: ${{ github.event_name != 'pull_request' }}
      - name: Verify locked Bazel module graph
        run: bazel mod deps --lockfile_mode=error
      - name: Build CLI from Cargo-resolved dependencies
        run: bazel build --lockfile_mode=error //:qualitygate
      - name: Run Bazel tests
        run: bazel test --lockfile_mode=error //:unit_tests //:bazel_contract_test
