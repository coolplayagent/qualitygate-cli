name: Release Skill Package

on:
  push:
    tags:
      - 'v*.*.*'
      - '*.*.*'
  workflow_dispatch:
    inputs:
      dry_run_tag:
        description: Tag-like version to validate and package without publishing.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: qualitygate

jobs:
  verify:
    name: Verify release inputs and quality gates
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.dry_run_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be v1.0.0, 1.0.0, or a SemVer prerelease: $tag" >&2
            exit 1
          fi
          version="${tag#v}"
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "tag $tag does not match Cargo.toml package.version $manifest_version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            prerelease=true
          fi
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - name: Format gate
        run: cargo fmt --all -- --check
      - name: Compilation gate
        run: cargo check --locked --all-targets --all-features
      - name: Clippy gate
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test gate
        run: cargo test --locked --all-targets --all-features
      - name: Coverage gate
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90
      - name: Validate source skill package
        run: cargo test --locked --test quality skill_package_contract_is_complete_and_matches_the_cli_version --all-features
      - name: Package crate
        run: cargo package --locked
      - name: Verify checks did not rewrite repository inputs
        run: git diff --exit-code

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            extension: ''
            artifact: qualitygate-linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            extension: ''
            artifact: qualitygate-linux-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            extension: '.exe'
            artifact: qualitygate-windows-x86_64
            msvc_arch: amd64
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            extension: '.exe'
            artifact: qualitygate-windows-aarch64
            msvc_arch: amd64_arm64
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install release target
        run: rustup target add ${{ matrix.target }}
      - name: Set up MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin qualitygate
      - name: Smoke test Linux binary
        if: runner.os == 'Linux'
        run: target/${{ matrix.target }}/release/${{ env.BIN_NAME }} --version
      - name: Smoke test Windows x64 binary
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: '& "target\\${{ matrix.target }}\\release\\${{ env.BIN_NAME }}.exe" --version'
      - name: Verify Windows ARM64 executable architecture
        if: matrix.target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        run: |
          $path = "target\\${{ matrix.target }}\\release\\${{ env.BIN_NAME }}.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw "Expected a PE executable at $path"
          }
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          if ($peOffset -lt 0 -or $peOffset + 6 -gt $bytes.Length) {
            throw "Invalid PE header offset in $path"
          }
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) {
            throw "Expected ARM64 PE machine type 0xAA64, got 0x{0:X4}" -f $machine
          }
      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.extension }}
          if-no-files-found: error

  skill:
    name: Package CLI skill
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Download Linux x64 binary
        uses: actions/download-artifact@v7
        with:
          name: qualitygate-linux-x86_64
          path: release-artifacts/linux-x86_64
      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v7
        with:
          name: qualitygate-linux-aarch64
          path: release-artifacts/linux-aarch64
      - name: Download Windows x64 binary
        uses: actions/download-artifact@v7
        with:
          name: qualitygate-windows-x86_64
          path: release-artifacts/windows-x86_64
      - name: Download Windows ARM64 binary
        uses: actions/download-artifact@v7
        with:
          name: qualitygate-windows-aarch64
          path: release-artifacts/windows-aarch64
      - name: Validate skill version inputs
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$manifest_version" = "${{ needs.verify.outputs.version }}"
          grep -Fqx '  version: "'"$manifest_version"'"' skills/qualitygate-cli/SKILL.md
      - name: Create and validate skill archive
        shell: bash
        run: |
          set -euo pipefail
          package="qualitygate-cli-skill-${{ needs.verify.outputs.tag }}"
          mkdir -p "dist/$package"
          cp -R skills/qualitygate-cli/. "dist/$package/"
          mkdir -p "dist/$package/assets/linux-x86_64" "dist/$package/assets/linux-aarch64"
          mkdir -p "dist/$package/assets/windows-x86_64" "dist/$package/assets/windows-aarch64"
          install -m 0755 release-artifacts/linux-x86_64/qualitygate "dist/$package/assets/linux-x86_64/qualitygate"
          install -m 0755 release-artifacts/linux-aarch64/qualitygate "dist/$package/assets/linux-aarch64/qualitygate"
          install -m 0755 release-artifacts/windows-x86_64/qualitygate.exe "dist/$package/assets/windows-x86_64/qualitygate.exe"
          install -m 0755 release-artifacts/windows-aarch64/qualitygate.exe "dist/$package/assets/windows-aarch64/qualitygate.exe"
          test -s "dist/$package/assets/linux-x86_64/qualitygate"
          test -s "dist/$package/assets/linux-aarch64/qualitygate"
          test -s "dist/$package/assets/windows-x86_64/qualitygate.exe"
          test -s "dist/$package/assets/windows-aarch64/qualitygate.exe"
          test -f "dist/$package/references/builtin-rules.md"
          test -s "dist/$package/references/clippy-ratchet.yaml"
          test -s "dist/$package/references/eslint-ratchet.yaml"
          test -s "dist/$package/references/golangci-lint-ratchet.yaml"
          test -s "dist/$package/references/ruff-ratchet.yaml"
          test -s "dist/$package/references/gcc-analyzer-ratchet.yaml"
          test -s "dist/$package/references/clang-static-analyzer-ratchet.yaml"
          test -s "dist/$package/references/spotbugs-ratchet.yaml"
          test -s "dist/$package/references/pmd-ratchet.yaml"
          test -s "dist/$package/references/checkstyle-ratchet.yaml"
          test -f "dist/$package/references/rule-authoring.md"
          test -s "dist/$package/references/pilot-evidence.md"
          test -s "dist/$package/assets/pilot/observation-v7.json"
          test -s "dist/$package/assets/pilot/observation-v8.json"
          test -s "dist/$package/assets/pilot/observation-v9.json"
          test -s "dist/$package/assets/pilot/observation-v10.json"
          for reference in file-contracts diagnostic-ratchets decision-protocol rule-management selfcheck; do
            test -s "dist/$package/references/$reference.md"
          done
          test -s "dist/$package/references/schemas/project-rule.schema.json"
          test -s "dist/$package/references/schemas/decision.schema.json"
          test -s "dist/$package/references/schemas/feedback.schema.json"
          test -s "dist/$package/references/schemas/command-error.schema.json"
          "dist/$package/assets/linux-x86_64/qualitygate" rules schema > "dist/project-rule.schema.json"
          grep -F 'urn:qualitygate:project-rule:1' "dist/project-rule.schema.json"
          test -f "dist/$package/references/rules/core/line-ending.yaml"
          test -f "dist/$package/references/rules/shared/security-sensitive-api.yaml"
          test -f "dist/$package/references/rules/shared/todo-marker.yaml"
          test -f "dist/$package/references/rules/shared/import-boundary.yaml"
          test -f "dist/$package/references/rules/lang-java/module-boundary.yaml"
          test -f "dist/$package/references/rules/lang-python/pytest-naming.yaml"
          for rule in core/commit-message-convention core/commit-message-format shared/test-naming-strict shared/test-annotation-dependency shared/no-hardcoded-secrets shared/no-printf-log shared/no-unsafe-string shared/no-test-sleep shared/no-bare-except shared/no-os-path shared/no-print shared/no-emoji shared/python-test-naming shared/shell-hardcoded-secret shared/shell-debug-mode shared/shell-env-dump shared/shell-weak-crypto shared/shell-password-echo shared/shell-sql-injection shared/shell-exec-terminates shared/shell-assignment-spaces shared/shell-comparison-spaces shared/shell-line-start-operator shared/shell-stream-merge-position shared/shell-trap-uncapturable shared/shell-trap-numeric-signal shared/shell-trap-double-quotes shared/shell-tilde-path shared/shell-temp-file-hardcoded shared/shell-missing-shebang shared/shell-commented-dead-code shared/rust-extern-without-abi shared/rust-untrusted-dynamic-library-loading shared/rust-unsafe-block-in-macro-definition lang-typescript/ts-no-eval lang-typescript/ts-no-debugger lang-typescript/ts-no-alert lang-typescript/ts-no-implied-eval lang-typescript/ts-no-new-function lang-typescript/ts-eqeqeq lang-typescript/ts-no-extend-native lang-typescript/ts-no-prototype-builtins lang-typescript/ts-secure-randomness lang-typescript/ts-no-unsafe-postmessage lang-typescript/ts-no-commented-code lang-typescript/ts-no-personal-info-in-comments lang-go/go-sql-injection lang-go/go-insecure-randomness lang-go/go-tls-insecure-skip-verify lang-go/go-hardcoded-credentials lang-go/go-ssh-insecure-ignore-host-key lang-go/go-file-permission-creation lang-go/go-panic-in-exported-function lang-go/go-cgo-cstring-without-defer-free lang-go/go-relative-import-path lang-go/go-dot-import lang-go/go-sensitive-info-in-log lang-go/go-float-loop-counter lang-python/py-eval-exec lang-python/py-shell-equals-true lang-python/py-insecure-randomness lang-python/py-tls-verify-disabled lang-python/py-yaml-unsafe-load lang-python/py-sql-string-format lang-python/py-hardcoded-credentials lang-python/py-tempfile-mktemp lang-python/py-bare-except lang-python/py-mutable-default-argument lang-python/py-assert-in-production lang-python/py-sensitive-info-in-log lang-python/py-pickle-load lang-c/c-array-safety lang-c/c-assertion-discipline lang-c/c-control-flow lang-c/c-expression-safety lang-c/c-file-security lang-c/c-function-safety lang-c/c-numeric-literal lang-cpp/cpp-no-realloc lang-cpp/cpp-no-alloca lang-cpp/cpp-no-unsafe-memfunc lang-cpp/cpp-throw-by-value lang-cpp/cpp-catch-by-reference lang-cpp/cpp-no-direct-mutex lang-cpp/cpp-no-std-move-local-return lang-cpp/cpp-no-unsafe-rand lang-cpp/cpp-no-throw-spec lang-java/java-thread-stop lang-java/java-thread-yield lang-java/java-manual-gc lang-java/java-finalizer lang-java/java-implicit-charset lang-java/java-implicit-locale lang-java/java-insecure-random lang-java/java-weak-crypto lang-java/java-empty-catch lang-java/java-finally-exit lang-java/java-sql-concat lang-java/java-runtime-exec; do
            test -f "dist/$package/references/rules/$rule.yaml"
          done
          "dist/$package/assets/linux-x86_64/qualitygate" \
            --root "$GITHUB_WORKSPACE" --format json rules list > "dist/rules-list.json"
          grep -F '"origin": "skill:references/rules/shared/security-sensitive-api.yaml"' "dist/rules-list.json"
          grep -F '"id": "import-boundary"' "dist/rules-list.json"
          for rule in commit-message-convention commit-message-format test-naming-strict test-annotation-dependency no-hardcoded-secrets no-printf-log no-unsafe-string no-test-sleep no-bare-except no-os-path no-print no-emoji python-test-naming shell-hardcoded-secret shell-debug-mode shell-env-dump shell-weak-crypto shell-password-echo shell-sql-injection shell-exec-terminates shell-assignment-spaces shell-comparison-spaces shell-line-start-operator shell-stream-merge-position shell-trap-uncapturable shell-trap-numeric-signal shell-trap-double-quotes shell-tilde-path shell-temp-file-hardcoded shell-missing-shebang shell-commented-dead-code rust-extern-without-abi rust-untrusted-dynamic-library-loading rust-unsafe-block-in-macro-definition ts-no-eval ts-no-debugger ts-no-alert ts-no-implied-eval ts-no-new-function ts-eqeqeq ts-no-extend-native ts-no-prototype-builtins ts-secure-randomness ts-no-unsafe-postmessage ts-no-commented-code ts-no-personal-info-in-comments go-sql-injection go-insecure-randomness go-tls-insecure-skip-verify go-hardcoded-credentials go-ssh-insecure-ignore-host-key go-file-permission-creation go-panic-in-exported-function go-cgo-cstring-without-defer-free go-relative-import-path go-dot-import go-sensitive-info-in-log go-float-loop-counter java-thread-stop java-thread-yield java-manual-gc java-finalizer java-implicit-charset java-implicit-locale java-insecure-random java-weak-crypto java-empty-catch java-finally-exit java-sql-concat java-runtime-exec; do
            grep -F "\"id\": \"$rule\"" "dist/rules-list.json"
          done
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/SKILL.md" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/README.md" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/operations.md" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/builtin-rules.md" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/clippy-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/eslint-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/golangci-lint-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/ruff-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/gcc-analyzer-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/clang-static-analyzer-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/spotbugs-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/pmd-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/checkstyle-ratchet.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/rule-authoring.md" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/pilot-evidence.md" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/pilot/observation-v7.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/pilot/observation-v8.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/pilot/observation-v9.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/pilot/observation-v10.json" >/dev/null
          for reference in file-contracts diagnostic-ratchets decision-protocol rule-management selfcheck; do
            tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/$reference.md" >/dev/null
          done
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/schemas/project-rule.schema.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/schemas/decision.schema.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/schemas/feedback.schema.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/schemas/command-error.schema.json" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/rules/shared/security-sensitive-api.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/rules/shared/todo-marker.yaml" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/rules/shared/import-boundary.yaml" >/dev/null
          for rule in core/commit-message-convention core/commit-message-format shared/test-naming-strict shared/test-annotation-dependency shared/no-hardcoded-secrets shared/no-printf-log shared/no-unsafe-string shared/no-test-sleep shared/no-bare-except shared/no-os-path shared/no-print shared/no-emoji shared/python-test-naming shared/shell-hardcoded-secret shared/shell-debug-mode shared/shell-env-dump shared/shell-weak-crypto shared/shell-password-echo shared/shell-sql-injection shared/shell-exec-terminates shared/shell-assignment-spaces shared/shell-comparison-spaces shared/shell-line-start-operator shared/shell-stream-merge-position shared/shell-trap-uncapturable shared/shell-trap-numeric-signal shared/shell-trap-double-quotes shared/shell-tilde-path shared/shell-temp-file-hardcoded shared/shell-missing-shebang shared/shell-commented-dead-code shared/rust-extern-without-abi shared/rust-untrusted-dynamic-library-loading shared/rust-unsafe-block-in-macro-definition lang-typescript/ts-no-eval lang-typescript/ts-no-debugger lang-typescript/ts-no-alert lang-typescript/ts-no-implied-eval lang-typescript/ts-no-new-function lang-typescript/ts-eqeqeq lang-typescript/ts-no-extend-native lang-typescript/ts-no-prototype-builtins lang-typescript/ts-secure-randomness lang-typescript/ts-no-unsafe-postmessage lang-typescript/ts-no-commented-code lang-typescript/ts-no-personal-info-in-comments lang-go/go-sql-injection lang-go/go-insecure-randomness lang-go/go-tls-insecure-skip-verify lang-go/go-hardcoded-credentials lang-go/go-ssh-insecure-ignore-host-key lang-go/go-file-permission-creation lang-go/go-panic-in-exported-function lang-go/go-cgo-cstring-without-defer-free lang-go/go-relative-import-path lang-go/go-dot-import lang-go/go-sensitive-info-in-log lang-go/go-float-loop-counter lang-python/py-eval-exec lang-python/py-shell-equals-true lang-python/py-insecure-randomness lang-python/py-tls-verify-disabled lang-python/py-yaml-unsafe-load lang-python/py-sql-string-format lang-python/py-hardcoded-credentials lang-python/py-tempfile-mktemp lang-python/py-bare-except lang-python/py-mutable-default-argument lang-python/py-assert-in-production lang-python/py-sensitive-info-in-log lang-python/py-pickle-load lang-c/c-array-safety lang-c/c-assertion-discipline lang-c/c-control-flow lang-c/c-expression-safety lang-c/c-file-security lang-c/c-function-safety lang-c/c-numeric-literal lang-cpp/cpp-no-realloc lang-cpp/cpp-no-alloca lang-cpp/cpp-no-unsafe-memfunc lang-cpp/cpp-throw-by-value lang-cpp/cpp-catch-by-reference lang-cpp/cpp-no-direct-mutex lang-cpp/cpp-no-std-move-local-return lang-cpp/cpp-no-unsafe-rand lang-cpp/cpp-no-throw-spec lang-java/java-thread-stop lang-java/java-thread-yield lang-java/java-manual-gc lang-java/java-finalizer lang-java/java-implicit-charset lang-java/java-implicit-locale lang-java/java-insecure-random lang-java/java-weak-crypto lang-java/java-empty-catch lang-java/java-finally-exit lang-java/java-sql-concat lang-java/java-runtime-exec; do
            tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/references/rules/$rule.yaml" >/dev/null
          done
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/linux-x86_64/qualitygate" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/linux-aarch64/qualitygate" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/windows-x86_64/qualitygate.exe" >/dev/null
          tar -tzf "dist/$package.tar.gz" | grep -Fx "$package/assets/windows-aarch64/qualitygate.exe" >/dev/null
      - name: Upload skill archive
        uses: actions/upload-artifact@v6
        with:
          name: qualitygate-cli-skill-${{ needs.verify.outputs.tag }}
          path: dist/qualitygate-cli-skill-${{ needs.verify.outputs.tag }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs: [verify, skill]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          name: qualitygate-cli-skill-${{ needs.verify.outputs.tag }}
          path: dist
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum qualitygate-cli-skill-${{ needs.verify.outputs.tag }}.tar.gz > checksums.txt
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.verify.outputs.tag }}"
          prerelease_args=()
          if [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]]; then
            prerelease_args+=(--prerelease)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber dist/*
          else
            gh release create "$tag" --title "$tag" --generate-notes "${prerelease_args[@]}" dist/*
          fi

  publish-skill:
    name: Publish ClawHub skill
    if: github.event_name == 'push'
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check ClawHub token
        id: clawhub-token
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CLAWHUB_TOKEN:-}" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Validate lightweight skill size
        if: steps.clawhub-token.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          limit = 10_000_000
          oversized = [path for path in Path("skills/qualitygate-cli").rglob("*") if path.is_file() and path.stat().st_size >= limit]
          if oversized:
              raise SystemExit(f"ClawHub files must stay below 10 MB: {oversized}")
          PY
      - name: Install ClawHub CLI
        if: steps.clawhub-token.outputs.publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish skill
        if: steps.clawhub-token.outputs.publish == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npm install -g clawhub
          tags="latest"
          if [[ "${{ needs.verify.outputs.prerelease }}" == "true" ]]; then
            tags="prerelease"
          fi
          clawhub --no-input login --token "$CLAWHUB_TOKEN"
          clawhub publish skills/qualitygate-cli \
            --slug qualitygate-cli \
            --name "Qualitygate CLI" \
            --version "${{ needs.verify.outputs.version }}" \
            --changelog "qualitygate-cli ${{ needs.verify.outputs.tag }}" \
            --tags "$tags"
