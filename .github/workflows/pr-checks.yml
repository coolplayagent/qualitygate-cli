name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: format
            command: cargo fmt --all -- --check
          - gate: check
            command: cargo check --locked --all-targets --all-features
          - gate: clippy
            command: cargo clippy --locked --all-targets --all-features -- -D warnings
          - gate: unit-test
            command: cargo test --locked --lib --bins --all-features
          - gate: rust-integration
            command: cargo test --locked --test cli --test custom_rules --test merge_request --test execution --all-features
          - gate: documentation
            command: cargo test --locked --test quality documentation --all-features
          - gate: architecture
            command: cargo test --locked --test quality architecture --all-features
          - gate: benchmark
            command: cargo test --locked --test benchmarks --all-features
          - gate: build
            command: cargo build --locked --all-targets --all-features
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run quality gate
        run: ${{ matrix.command }}
      - name: Verify checks did not rewrite repository inputs
        run: git diff --exit-code

  cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo test --locked --all-targets --all-features

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Rust line coverage gate
        run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90 --lcov --output-path target/coverage.lcov
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage.lcov
          if-no-files-found: error

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - name: Miri pure-domain gate
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-deterministic-concurrency
        run: 'cargo +nightly miri test --locked --lib --all-features domain::'

  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: AddressSanitizer native gate
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: cargo +nightly test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib --bins --all-features

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo package --locked
