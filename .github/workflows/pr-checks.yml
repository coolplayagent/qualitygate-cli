name: PR Checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stable:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: ${{ matrix.gate }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: format
            command: cargo fmt --all -- --check
          - gate: check
            command: cargo check --locked --all-targets --all-features
          - gate: clippy
            command: cargo clippy --locked --all-targets --all-features -- -D warnings
          - gate: unit-test
            command: cargo test --locked --lib --bins --all-features
          - gate: rust-integration
            command: cargo test --locked --test bazel --test cli --test custom_rules --test file_contracts --test ratchet --test test_effectiveness --test pilot_baseline --test feedback --test agent_loop --test case_provenance --test pilot_summary --test pilot_seal --test pilot_authorization --test pilot_acceptance --test pilot_templates --test rule_authoring --test rule_management --test issue9_rules --test issue10_rules --test issue11_rules --test issue12_rules --test issue13_rules --test issue14_rules --test issue15_rules --test issue16_rules --test issue18_rules --test c_family_ratchet --test clippy_ratchet --test eslint_ratchet --test golangci_ratchet --test ruff_ratchet --test policy_categories --test policy_candidates --test policy_validation --test policy_promotion --test policy_lifecycle --test merge_request --test execution --test init --test manual --test provenance --test git_trailers --test compatibility --test sarif --test coverage --test source_reviews --test policy --test selfcheck --all-features
          - gate: selfcheck-minimal
            command: cargo run --locked -- selfcheck --fixture minimal --format json
          - gate: documentation
            command: cargo test --locked --test quality documentation --all-features
          - gate: architecture
            command: cargo test --locked --test quality architecture --all-features
          - gate: benchmark
            command: cargo test --locked --test benchmarks --test large_repository --test policy_performance --all-features -- --nocapture
          - gate: build
            command: cargo build --locked --all-targets --all-features
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run quality gate
        run: ${{ matrix.command }}
      - name: Upload architecture dependency evidence
        if: always() && matrix.gate == 'architecture'
        uses: actions/upload-artifact@v4
        with:
          name: architecture
          path: |
            target/architecture/report.json
            target/architecture/graph.dot
          if-no-files-found: error
      - name: Verify checks did not rewrite repository inputs
        run: git diff --exit-code

  cross-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Run Windows gates in runner temporary storage
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo test --locked --all-targets --all-features
      - name: Run macOS gates
        if: runner.os != 'Windows'
        run: cargo test --locked --all-targets --all-features

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Rust line coverage gate
        run: cargo llvm-cov --locked --all-targets --all-features --fail-under-lines 90 --lcov --output-path target/coverage.lcov
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage.lcov
          if-no-files-found: error

  maven-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup show
      - name: Live Maven dependency and repair acceptance
        run: cargo test --locked --test maven -- --ignored --nocapture --test-threads=1

  python-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pip==26.0.1
      - run: rustup show
      - name: Live Python dependency and pytest repair acceptance
        run: cargo test --locked --test python -- --ignored --nocapture

  java-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - run: rustup show
      - name: Live binary/source compatibility and repair
        run: cargo test --locked --test compatibility_live -- --ignored --nocapture

  sarif-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo install clippy-sarif --version 0.8.0 --locked
      - name: Live Clippy SARIF baseline and repair acceptance
        run: cargo test --locked --test sarif_live -- --ignored --nocapture
      - name: Live Clippy stdout ratchet and repair acceptance
        run: cargo test --locked --test clippy_ratchet -- --ignored --nocapture

  c-family-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Check C and C++ SARIF compiler versions
        run: |
          gcc --version
          g++ --version
      - name: Live C and C++ analyzer SARIF ratchet acceptance
        run: cargo test --locked --test c_family_ratchet -- --ignored --nocapture

  eslint-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup show
      - name: Live ESLint JSON ratchet and repair acceptance
        run: cargo test --locked --test eslint_ratchet -- --ignored --nocapture

  golangci-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
          cache: false
      - run: rustup show
      - name: Install pinned golangci-lint v2 binary
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/golangci-lint.tar.gz" https://github.com/golangci/golangci-lint/releases/download/v2.13.2/golangci-lint-2.13.2-linux-amd64.tar.gz
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/golangci-lint.tar.gz"
      - name: Live golangci-lint JSON ratchet and repair acceptance
        env:
          GOLANGCI_LINT_BIN: ${{ runner.temp }}/golangci-lint-2.13.2-linux-amd64/golangci-lint
        run: cargo test --locked --test golangci_ratchet -- --ignored --nocapture

  ruff-project:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - name: Install pinned Ruff binary
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ruff-x86_64-unknown-linux-gnu.tar.gz" https://github.com/astral-sh/ruff/releases/download/0.16.8/ruff-x86_64-unknown-linux-gnu.tar.gz
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/ruff-x86_64-unknown-linux-gnu.tar.gz.sha256" https://github.com/astral-sh/ruff/releases/download/0.16.8/ruff-x86_64-unknown-linux-gnu.tar.gz.sha256
          cd "$RUNNER_TEMP"
          sha256sum -c ruff-x86_64-unknown-linux-gnu.tar.gz.sha256
          tar -xzf ruff-x86_64-unknown-linux-gnu.tar.gz
      - name: Live Ruff JSON ratchet and repair acceptance
        env:
          RUFF_BIN: ${{ runner.temp }}/ruff-x86_64-unknown-linux-gnu/ruff
        run: cargo test --locked --test ruff_ratchet -- --ignored --nocapture

  coverage-producers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check coverage==7.10.7 pytest==8.4.2
      - run: rustup show
      - name: Live JaCoCo, coverage.py and LLVM coverage acceptance
        run: cargo test --locked --test coverage_live --test coverage_llvm_live -- --ignored --nocapture

  miri:
    name: miri (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [evolution, pilot-base, pilot-versions, other-domain]
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - name: Miri pure-domain gate
        env:
          MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-deterministic-concurrency
        run: |
          case "${{ matrix.shard }}" in
            evolution)
              cargo +nightly miri test --locked --lib --all-features domain::evolution::
              ;;
            pilot-base)
              cargo +nightly miri test --locked --lib --all-features domain::pilot::tests:: -- --skip domain::pilot::tests::v
              ;;
            pilot-versions)
              cargo +nightly miri test --locked --lib --all-features domain::pilot::tests::v
              ;;
            other-domain)
              cargo +nightly miri test --locked --lib --all-features domain:: -- --skip domain::evolution:: --skip domain::pilot::tests::
              ;;
          esac

  address-sanitizer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - name: AddressSanitizer native gate
        env:
          ASAN_OPTIONS: detect_leaks=1
          RUSTFLAGS: -Zsanitizer=address
          RUSTDOCFLAGS: -Zsanitizer=address
        run: cargo +nightly test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --lib --bins --all-features

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: rustup show
      - run: cargo package --locked
