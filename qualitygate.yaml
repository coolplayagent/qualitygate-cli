schema_version: 1
languages: [rust]
rulesets: [core]
rules:
  line-ending:
    enabled: true
    required: true
    severity: error
checks:
  - id: format
    kind: command
    argv: [cargo, fmt, --all, --, --check]
    tools:
      - {id: rustfmt, argv: [rustfmt, --version]}
    timeout_seconds: 120
  - id: check
    kind: command
    argv: [cargo, check, --locked, --all-targets, --all-features]
    tools:
      - {id: cargo, argv: [cargo, --version]}
      - {id: rustc, argv: [rustc, --version, --verbose]}
    timeout_seconds: 900
  - id: clippy
    kind: command
    argv: [cargo, clippy, --locked, --all-targets, --all-features, --, -D, warnings]
    tools:
      - {id: clippy, argv: [cargo, clippy, --version]}
    timeout_seconds: 900
    depends_on: [check]
  - id: unit-test
    kind: command
    argv: [cargo, test, --locked, --lib, --bins, --all-features]
    tools:
      - {id: cargo, argv: [cargo, --version]}
      - {id: rustc, argv: [rustc, --version, --verbose]}
    timeout_seconds: 900
    depends_on: [check]
  - id: integration
    kind: command
    argv: [cargo, test, --locked, --test, bazel, --test, cli, --test, custom_rules, --test, file_contracts, --test, delivery_scope, --test, ratchet, --test, test_effectiveness, --test, pilot_baseline, --test, feedback, --test, agent_loop, --test, case_provenance, --test, pilot_summary, --test, pilot_seal, --test, pilot_authorization, --test, pilot_acceptance, --test, pilot_templates, --test, rule_authoring, --test, rule_management, --test, issue9_rules, --test, issue10_rules, --test, issue11_rules, --test, issue12_rules, --test, issue13_rules, --test, issue14_rules, --test, issue15_rules, --test, issue16_rules, --test, clippy_ratchet, --test, eslint_ratchet, --test, golangci_ratchet, --test, ruff_ratchet, --test, merge_request, --test, execution, --test, init, --test, manual, --test, provenance, --test, git_trailers, --test, compatibility, --test, sarif, --test, coverage, --test, source_reviews, --test, policy, --test, selfcheck, --test, large_repository, --test, benchmarks, --all-features]
    tools:
      - {id: cargo, argv: [cargo, --version]}
      - {id: rustc, argv: [rustc, --version, --verbose]}
    timeout_seconds: 900
    depends_on: [check]
  - id: selfcheck
    kind: command
    argv: [cargo, run, --locked, --, selfcheck, --format, json]
    tools:
      - {id: cargo, argv: [cargo, --version]}
    timeout_seconds: 180
    depends_on: [check]
  - id: quality
    kind: command
    argv: [cargo, test, --locked, --test, quality, --all-features]
    tools:
      - {id: cargo, argv: [cargo, --version]}
      - {id: rustc, argv: [rustc, --version, --verbose]}
    timeout_seconds: 900
    depends_on: [check]
  - id: bazel-module-lock
    kind: command
    argv: [bazel, mod, deps, "--lockfile_mode=error"]
    tools:
      - {id: bazel, argv: [bazel, --version]}
    timeout_seconds: 900
  - id: bazel-build
    kind: command
    argv: [bazel, build, "--lockfile_mode=error", "//:qualitygate"]
    tools:
      - {id: bazel, argv: [bazel, --version]}
    timeout_seconds: 900
    depends_on: [bazel-module-lock]
  - id: bazel-test
    kind: command
    argv: [bazel, test, "--lockfile_mode=error", "//..."]
    tools:
      - {id: bazel, argv: [bazel, --version]}
    timeout_seconds: 900
    depends_on: [bazel-build]
profiles:
  quick:
    include: [line-ending, format]
  full:
    include: [line-ending, format, check, clippy, unit-test, integration, selfcheck, quality, bazel-module-lock, bazel-build, bazel-test]
verification_assets:
  - qualitygate.yaml
  - Cargo.toml
  - rust-toolchain.toml
  - .bazelrc
  - .bazelignore
  - .bazelversion
  - BUILD.bazel
  - MODULE.bazel
  - MODULE.bazel.lock
  - bazel/**
  - src/qualitygate/**/BUILD.bazel
  - tests/**
  - templates/**
  - examples/**
  - fixtures/**
  - .github/workflows/**
